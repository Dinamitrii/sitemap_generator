<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2">
  <title>Сканиране...</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; text-align: center; }
    progress { width: 100%; height: 1rem; }
  </style>
</head>
<body>
  <h1>Сканирането е в ход…</h1>
  <p>{{ scan.start_url }}</p>
  <progress max="{{ max_pages }}" value="{{ scan.crawled }}"></progress>
  <p>Намерени страници: {{ scan.crawled }}</p>
  <p><small>Страницата се опреснява автоматично.</small></p>
</body>
</html>
