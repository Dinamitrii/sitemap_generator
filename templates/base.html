<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моят Блог{% endblock %}</title>
    <!-- Добавяме малко базов стил за по-красив изглед -->
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f9f9f9;
            color: #333;
        }

        header {
            border-bottom: 2px solid #ddd;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 0.9em;
            color: #666;
        }

        .post-link {
            font-size: 1.2em;
            color: #222;
            text-decoration: none;
        }

        .post-link:hover {
            color: #007BFF;
        }

        .meta {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<

<header>
    <h1>🚀 Моят Flask SEO Проект</h1>
    <nav>
        <a href="{{ url_for('index') }}">Начало</a>
        <a href="/sitemap.xml" target="_blank">Sitemap.xml</a>
        <a href="/robots.txt" target="_blank">Robots.txt</a>
    </nav>
</header>

<div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; display: flex; gap: 15px;">
    <h3>💾 Изтегли файловете за хостинг:</h3>
    <a href="{{ url_for('export_file', filename='sitemap.xml') }}"
       style="background: #007BFF; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold;">Свали
        sitemap.xml</a>
    <a href="{{ url_for('export_file', filename='robots.txt') }}"
       style="background: #6c757d; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold;">Свали
        robots.txt</a>
</div>



<main>
    <!-- Тук ще се вмъква съдържанието от другите страници -->
    {% block content %}{% endblock %}
</main>

<footer>
    <p>&copy; 2026 Всички права запазени.</p>
</footer>

</body>
</html>
